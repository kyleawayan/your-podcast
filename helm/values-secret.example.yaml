# Copy this file to values-secret.yaml and fill in real values.
# values-secret.yaml is gitignored and will NOT be committed.
#
# Usage: ./deploy.sh --values helm/values-secret.yaml
secret:
  geminiApiKey: "your-gemini-api-key"
  ttsBackend: "google_cloud" # or "elevenlabs"
  elevenlabsApiKey: "your-elevenlabs-api-key"
  googleCloudVoice1: "Kore"
  googleCloudVoice2: "Charon"
  googleCloudModel: "gemini-2.5-flash-preview-tts"

overnightJobs:
  fetchSubreddits:
    - your-subreddit
  podcasts:
    - user: your-username
      duration: 30
      subreddits:
        - your-subreddit
