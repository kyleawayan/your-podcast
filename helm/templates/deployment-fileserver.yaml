{{- if .Values.fileserver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "your-podcast.fullname" . }}-fileserver
  labels:
    {{- include "your-podcast.labels" . | nindent 4 }}
    app.kubernetes.io/component: fileserver
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "your-podcast.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fileserver
  template:
    metadata:
      labels:
        {{- include "your-podcast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fileserver
    spec:
      initContainers:
        - name: ensure-dirs
          image: busybox:1.37
          command: ["mkdir", "-p", "/app/data/podcasts"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - name: http
              containerPort: {{ .Values.fileserver.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            {{- toYaml .Values.fileserver.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "your-podcast.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: caddyfile
          configMap:
            name: {{ include "your-podcast.fullname" . }}-caddyfile
{{- end }}
