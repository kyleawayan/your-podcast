apiVersion: v1
kind: Secret
metadata:
  name: {{ include "your-podcast.fullname" . }}
  labels:
    {{- include "your-podcast.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "your-podcast.databaseUrl" . | quote }}
  GEMINI_API_KEY: {{ .Values.secret.geminiApiKey | quote }}
  TTS_BACKEND: {{ .Values.secret.ttsBackend | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secret.elevenlabsApiKey | quote }}
  ELEVENLABS_VOICE_1: {{ .Values.secret.elevenlabsVoice1 | quote }}
  ELEVENLABS_VOICE_2: {{ .Values.secret.elevenlabsVoice2 | quote }}
  GOOGLE_CLOUD_VOICE_1: {{ .Values.secret.googleCloudVoice1 | quote }}
  GOOGLE_CLOUD_VOICE_2: {{ .Values.secret.googleCloudVoice2 | quote }}
  GOOGLE_CLOUD_MODEL: {{ .Values.secret.googleCloudModel | quote }}
